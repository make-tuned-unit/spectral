[package]
name = "spectral-bench-real"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Benchmark harness for measuring Spectral recall latency and accuracy against real brains."

[[bin]]
name = "spectral-bench-real"
path = "src/main.rs"

[[bin]]
name = "phase0"
path = "src/bin/phase0.rs"

[[bin]]
name = "coret_ablation"
path = "src/bin/coret_ablation.rs"

[[bin]]
name = "poison_bench"
path = "src/bin/poison_bench.rs"

[[bin]]
name = "recognition_bench"
path = "src/bin/recognition_bench.rs"

[[bin]]
name = "recurrence_bench"
path = "src/bin/recurrence_bench.rs"

[[bin]]
name = "recall_debug"
path = "src/bin/recall_debug.rs"

[[bin]]
name = "anticipatory_bench"
path = "src/bin/anticipatory_bench.rs"

[dependencies]
chrono = { workspace = true }
spectral-bench-accuracy = { path = "../spectral-bench-accuracy" }
spectral-core = { path = "../spectral-core" }
spectral-graph = { path = "../spectral-graph", features = ["spectrogram-legacy"] }
spectral-spectrogram = { path = "../spectral-spectrogram" }
blake3 = { workspace = true }
spectral-ingest = { path = "../spectral-ingest", features = ["sqlite"] }
spectral-recognition = { path = "../spectral-recognition" }
spectral-tact = { path = "../spectral-tact" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tempfile = "3"

[[bin]]
name = "write_path_cost"
path = "src/bin/write_path_cost.rs"

[[bin]]
name = "fingerprint_cap_equivalence"
path = "src/bin/fingerprint_cap_equivalence.rs"

[[bin]]
name = "recall_path_cost"
path = "src/bin/recall_path_cost.rs"

[[bin]]
name = "stmt_cache_probe"
path = "src/bin/stmt_cache_probe.rs"

[[bin]]
name = "tact_tier_probe"
path = "src/bin/tact_tier_probe.rs"

[[bin]]
name = "concurrency_probe"
path = "src/bin/concurrency_probe.rs"
