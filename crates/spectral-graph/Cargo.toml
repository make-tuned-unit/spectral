[package]
name = "spectral-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graph layer for Spectral: SQLite graph storage, ontology canonicalization, provenance."

[dependencies]
spectral-core = { path = "../spectral-core" }
spectral-ingest = { path = "../spectral-ingest" }
spectral-spectrogram = { path = "../spectral-spectrogram", optional = true }
spectral-tact = { path = "../spectral-tact" }
spectral-cascade = { path = "../spectral-cascade" }
spectral-recognition = { path = "../spectral-recognition" }
tokio = { workspace = true }
rusqlite = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
strsim = { workspace = true }
hostname = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Adjudicator trait errors: mirrors spectral-archivist's Consolidator signature.
anyhow = { workspace = true }

[features]
# Spectrogram-as-recall is retired: 0/500 contexts changed in the Tier-0
# retrieval oracle (docs/internal/ORACLE_TIER0.md). The code paths are kept
# behind this off-by-default feature for historical experiments only.
spectrogram-legacy = ["dep:spectral-spectrogram"]

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
