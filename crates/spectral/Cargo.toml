[package]
name = "spectral"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic, embedding-free memory for AI agents: recall, recognition, and adaptive feedback. Local-first and federation-ready, in one local SQLite-backed folder — no vector DB, no LLM on the recall path."
readme = "../../README.md"
keywords = ["memory", "ai-agents", "llm", "retrieval", "recognition"]
categories = ["data-structures", "database", "text-processing"]

[dependencies]
spectral-core = { path = "../spectral-core" }
spectral-ingest = { path = "../spectral-ingest" }
spectral-cascade = { path = "../spectral-cascade" }
spectral-graph = { path = "../spectral-graph" }
spectral-tact = { path = "../spectral-tact" }
spectral-spectrogram = { path = "../spectral-spectrogram", optional = true }
spectral-recognition = { path = "../spectral-recognition" }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true }
fastembed = { version = "5", optional = true, default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }

[features]
default = ["http-llm"]
http-llm = ["dep:reqwest"]
neural-bench = ["dep:fastembed"]
# Spectrogram-as-recall is retired: 0/500 contexts changed in the Tier-0
# retrieval oracle (docs/internal/ORACLE_TIER0.md). This off-by-default
# feature re-exposes the deprecated entry points for historical experiments.
spectrogram-legacy = ["dep:spectral-spectrogram", "spectral-graph/spectrogram-legacy"]

[dev-dependencies]
chrono = { workspace = true }
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "retrieval"
harness = false

[[bench]]
name = "vector_comparison"
harness = false
required-features = ["neural-bench"]
