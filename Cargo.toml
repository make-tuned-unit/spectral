[workspace]
resolver = "2"
members = [
    "crates/spectral-core",
    "crates/spectral-ingest",
    "crates/spectral-graph",
    "crates/spectral-tact",
    "crates/spectral-spectrogram",
    "crates/spectral",
    "crates/spectral-bench-real",
    "crates/spectral-archivist",
    "crates/spectral-bench-accuracy",
    "crates/spectral-cascade",
    "crates/spectral-recognition",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Spectral Contributors"]
repository = "https://github.com/make-tuned-unit/spectral"
homepage = "https://github.com/make-tuned-unit/spectral"
readme = "README.md"

[workspace.dependencies]
# Crypto + identity
blake3 = "1.5"
# No `rand_core` feature: the only caller of `SigningKey::generate` now takes
# entropy from `getrandom` directly, so the RNG integration is dead weight.
ed25519-dalek = { version = "3.0" }
# `getrandom`, not `rand`. ed25519-dalek 3.0 moved to rand_core 0.10, which is
# traits-only and ships no `OsRng` at all, while `rand` 0.9 still carries
# rand_core 0.9 — the two `CryptoRng` traits are not interchangeable. Since
# `SigningKey::generate` is just `fill_bytes` into 32 bytes followed by
# `from_bytes`, taking the entropy directly sidesteps the trait-version skew
# entirely and cannot drift out of step with dalek again.
getrandom = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# String matching
strsim = "0.11"

# TACT / memory ingestion
sha2 = "0.10"
regex = "1"

# Errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Caching
lru = "0.18"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# System info
hostname = "0.4"

# Async (used by some crates)
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
